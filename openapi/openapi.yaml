openapi: 3.0.3
info:
  title: COIN_BINDER_API
  version: 0.1.0
servers:
  - url: http://localhost:3000
tags:
  - name: categories
paths:
  /categories:
    get:
      tags:
        - categories
      summary: Get all user categories
      operationId: getCategories
      tags: [categories]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
    post:
      tags:
        - categories
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/responses/BadRequest'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
  /categories/{categoryId}:
    get:
      tags:
        - categories
      summary: Get a category by ID
      operationId: getCategoryById
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
    put:
      tags:
        - categories
      summary: Update a category by ID
      operationId: updateCategoryById
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategory'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/responses/BadRequest'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - categories
      summary: Delete a category by ID
      operationId: deleteCategoryById
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted successfully
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
  /categories/{categoryId}/expenses:
    get:
      tags:
        - categories
      summary: Get all expenses for a category
      operationId: getExpensesByCategoryId
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
  /categories/expenses:
    post:
      tags:
        - categories
      summary: Create a new expense for a category
      operationId: createExpenseForCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExpenseForCategory'
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/responses/BadRequest'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
  /categories/expenses/{expenseId}:
    get:
      tags:
        - categories
      summary: Get an expense by ID
      operationId: getExpenseById
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
    put:
      tags:
        - categories
      summary: Update an expense by ID
      operationId: updateExpenseById
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expense'
      responses:
        '200':
          description: Expense updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/responses/BadRequest'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - categories
      summary: Delete an expense by ID
      operationId: deleteExpenseById
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Expense deleted successfully
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/responses/InternalError'
components:  
  schemas:
    Category:
      type: object
      required: [id, user_id, label, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        label:
          type: string
        created_at:
          type: string
          format: date-time
    NewCategory:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          type: number
          format: float
    UpdateCategory:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          type: number
          format: float
    Expense:
      type: object
      required: [id, label, user_id, month, amount, created_at]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        user_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        month:
          type: string
          format: date-time
        amount:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
    NewExpenseForCategory:
      type: object
      required: [label, category_id, month, amount]
      properties:
        label:
          type: string
        category_id:
          type: integer
          format: int64
        month:
          type: string
          format: date-time
        amount:
          type: number
          format: float
    UpdateExpense:
      type: object
      required: [label, amount]
      description: Update an existing expense (possibility changing its category)
      properties:
        label:
          type: string
        category_id:
          type: integer
          format: int64
        amount:
          type: number
          format: float
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
  # Error responses
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }