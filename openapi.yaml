openapi: 3.0.3
info:
  title: COIN_BINDER_API
  version: 0.1.0
servers:
  - url: http://localhost:3000
tags:
  - name: categories
paths:
  /categories:
    get:
      tags:
        - categories
      summary: Get all user categories
      operationId: getCategories
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 1
                  user_id: 1
                  label: Courses
                  amount: 215.95
                  created_at: "2026-10-01T09:30:00Z"
                - id: 2
                  user_id: 1
                  label: Dépenses Civic
                  amount: 254.80
                  created_at: "2026-10-01T09:31:00Z"
                - id: 3
                  user_id: 1
                  label: Abonnements
                  amount: 39.46
                  created_at: "2026-10-01T09:32:00Z"
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - categories
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
            example:
              label: Abonnements
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 3
                user_id: 1
                label: Abonnements
                amount: 0.0
                created_at: "2026-10-01T09:32:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories/{categoryId}:
    get:
      tags:
        - categories
      summary: Get a category by ID
      operationId: getCategoryById
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 1
                user_id: 1
                label: Courses
                amount: 215.95
                created_at: "2026-10-01T09:30:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - categories
      summary: Update a category by ID
      operationId: updateCategoryById
      parameters:
        - $ref: '#/components/parameters/categoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategory'
            example:
              label: Dépenses Civic
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 2
                user_id: 1
                label: Dépenses Civic
                amount: 254.80
                created_at: "2026-10-01T09:31:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - categories
      summary: Delete a category by ID
      operationId: deleteCategoryById
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '204':
          description: Category deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories/{categoryId}/expenses:
    get:
      tags:
        - categories
      summary: Get all expenses for a category
      operationId: getExpensesByCategoryId
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
              examples:
                courses:
                  summary: Dépenses de la catégorie Courses
                  value:
                    - id: 1
                      label: Carrefour
                      user_id: 1
                      category_id: 1
                      month: "2026-10-01T00:00:00Z"
                      amount: 54.30
                      created_at: "2026-10-02T18:12:00Z"
                    - id: 2
                      label: Leclerc
                      user_id: 1
                      category_id: 1
                      month: "2026-10-01T00:00:00Z"
                      amount: 87.15
                      created_at: "2026-10-09T10:20:00Z"
                    - id: 3
                      label: Lidl
                      user_id: 1
                      category_id: 1
                      month: "2026-10-01T00:00:00Z"
                      amount: 32.60
                      created_at: "2026-10-16T17:45:00Z"
                    - id: 4
                      label: Intermarché
                      user_id: 1
                      category_id: 1
                      month: "2026-10-01T00:00:00Z"
                      amount: 41.90
                      created_at: "2026-10-23T12:10:00Z"
                civic:
                  summary: Dépenses de la catégorie Dépenses Civic
                  value:
                    - id: 5
                      label: Plein essence TotalEnergies
                      user_id: 1
                      category_id: 2
                      month: "2026-10-01T00:00:00Z"
                      amount: 62.40
                      created_at: "2026-10-03T07:45:00Z"
                    - id: 6
                      label: Vidange + filtre à huile
                      user_id: 1
                      category_id: 2
                      month: "2026-10-01T00:00:00Z"
                      amount: 89.90
                      created_at: "2026-10-12T14:30:00Z"
                    - id: 7
                      label: Plaquettes de frein avant
                      user_id: 1
                      category_id: 2
                      month: "2026-10-01T00:00:00Z"
                      amount: 74.50
                      created_at: "2026-10-15T16:00:00Z"
                    - id: 8
                      label: Bougies d'allumage NGK
                      user_id: 1
                      category_id: 2
                      month: "2026-10-01T00:00:00Z"
                      amount: 28.00
                      created_at: "2026-10-19T11:15:00Z"
                abonnements:
                  summary: Dépenses de la catégorie Abonnements
                  value:
                    - id: 9
                      label: Netflix
                      user_id: 1
                      category_id: 3
                      month: "2026-10-01T00:00:00Z"
                      amount: 13.49
                      created_at: "2026-10-05T07:00:00Z"
                    - id: 10
                      label: Crunchyroll
                      user_id: 1
                      category_id: 3
                      month: "2026-10-01T00:00:00Z"
                      amount: 7.99
                      created_at: "2026-10-08T07:00:00Z"
                    - id: 11
                      label: Spotify
                      user_id: 1
                      category_id: 3
                      month: "2026-10-01T00:00:00Z"
                      amount: 10.99
                      created_at: "2026-10-12T07:00:00Z"
                    - id: 12
                      label: Amazon Prime
                      user_id: 1
                      category_id: 3
                      month: "2026-10-01T00:00:00Z"
                      amount: 6.99
                      created_at: "2026-10-15T07:00:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories/expenses:
    post:
      tags:
        - categories
      summary: Create a new expense for a category
      operationId: createExpenseForCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExpenseForCategory'
            example:
              label: Netflix
              category_id: 3
              month: "2026-10-01T00:00:00Z"
              amount: 13.49
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
              example:
                id: 9
                label: Netflix
                user_id: 1
                category_id: 3
                month: "2026-10-01T00:00:00Z"
                amount: 13.49
                created_at: "2026-10-05T07:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories/expenses/{expenseId}:
    get:
      tags:
        - categories
      summary: Get an expense by ID
      operationId: getExpenseById
      parameters:
        - $ref: '#/components/parameters/expenseId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
              example:
                id: 1
                label: Carrefour
                user_id: 1
                category_id: 1
                month: "2026-10-01T00:00:00Z"
                amount: 54.30
                created_at: "2026-10-02T18:12:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - categories
      summary: Update an expense by ID
      operationId: updateExpenseById
      parameters:
        - $ref: '#/components/parameters/expenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpense'
            example:
              label: Plein essence TotalEnergies
              category_id: 2
              amount: 64.10
      responses:
        '200':
          description: Expense updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
              example:
                id: 5
                label: Plein essence TotalEnergies
                user_id: 1
                category_id: 2
                month: "2026-10-01T00:00:00Z"
                amount: 64.10
                created_at: "2026-10-03T07:45:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - categories
      summary: Delete an expense by ID
      operationId: deleteExpenseById
      parameters:
        - $ref: '#/components/parameters/expenseId'
      responses:
        '204':
          description: Expense deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    expenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Category:
      type: object
      required: [id, user_id, label, amount, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        label:
          type: string
        amount:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
    NewCategory:
      type: object
      required: [label]
      properties:
        label:
          type: string
    UpdateCategory:
      type: object
      required: [label]
      properties:
        label:
          type: string
    Expense:
      type: object
      required: [id, label, user_id, month, amount, created_at]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        user_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        month:
          type: string
          format: date-time
        amount:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
    NewExpenseForCategory:
      type: object
      required: [label, category_id, month, amount]
      properties:
        label:
          type: string
        category_id:
          type: integer
          format: int64
        month:
          type: string
          format: date-time
        amount:
          type: number
          format: double
    UpdateExpense:
      type: object
      required: [label, amount]
      description: Update an existing expense (possibly changing its category)
      properties:
        label:
          type: string
        category_id:
          type: integer
          format: int64
        amount:
          type: number
          format: double
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'