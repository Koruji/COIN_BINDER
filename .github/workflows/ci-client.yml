name: CI Client

on:
  pull_request:
    paths: ["client/**", "openapi.yaml", ".github/workflows/ci-client.yml"]
  push:
    branches: [main, develop]
    paths: ["client/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test --if-present